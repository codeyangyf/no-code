server:
  port: 8080

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/lc_platform?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:password}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-here-must-be-at-least-32-characters}
  access-token-expire-minutes: 15
  refresh-token-expire-days: 7

logging:
  level:
    com.lc: DEBUG
    org.springframework.security: INFO

storage:
  type: local
  local-path: ./storage
  endpoint: ${MINIO_ENDPOINT:}
  access-key: ${MINIO_ACCESS_KEY:}
  secret-key: ${MINIO_SECRET_KEY:}
  default-bucket: lc-platform
  max-file-size: 10485760

encrypt:
  key: ${LC_ENCRYPT_KEY:lc-platform-2026-secure-key-32bx}

cors:
  allowed-origins:
    - http://localhost:5173
    - http://localhost:3000
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allow-credentials: true
  max-age: 3600
